[project]
name = "claude-utils"
dynamic = ["version"]
description = "Utilities for managing Claude Code local data (history, sessions, telemetry)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "BSD-3-Clause" }
authors = [{ name = "University of Washington" }]
keywords = ["claude", "cli", "cleanup", "records-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.3.1",
]

[project.scripts]
claude-utils = "claude_utils.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_utils"]

[tool.hatch.build.targets.sdist]
include = ["src/claude_utils"]

[dependency-groups]
dev = [
    "black>=24.0",
    "isort>=5.13",
    "pytest>=8.0",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers -ra --tb=short"
